<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고객 감정 답 화면</title>
<meta name="robots" content="noindex">
<style>
/* 빔프로젝터 FHD 한 화면. 가운데 = 통화 중인 고객, 둘레 = 녹취 파형.
   교육생 감정은 파형 밖으로 떠오르는 생각풍선(감정 갈래마다 꽉 찬 색).
   장식 없음: 그림자·얇은 선·작은 라벨 안 씀. 회사 PC 크롬 84 기준(inset·aspect-ratio·:is 안 씀) */
:root {
  --bg: #eef1f5; --ink: #141c26; --soft: #4f5b6a; --step: #dfe5ec; --paper: #ffffff;
  --wave: #b9c3cf; --accent: #d02a2a;
  --angry: #c62828;
  --stuffy: #c2570c;
  --anxious: #6a3fc2;
  --sad: #1f5bc4;
  --tired: #1d7563;
  --other: #3b4655;
  --font: "LG스마트체", "LG Smart UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); word-break: keep-all; }

.top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; padding: 40px 48px 0; z-index: 3; pointer-events: none; }
.top > * { pointer-events: auto; }
h1 { margin: 0; font-size: 60px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.qr { display: flex; align-items: center; background: var(--paper); padding: 14px 24px 14px 14px; }
.qr img { width: 140px; height: 140px; display: block; margin-right: 18px; }
.qr .how { font-size: 24px; font-weight: 700; line-height: 1.35; }
.qr .url { font-size: 15px; color: var(--soft); margin-top: 8px; }

#stage { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
.wave { position: absolute; z-index: 1; overflow: visible; }
.wave line { stroke: var(--wave); stroke-width: 6; stroke-linecap: round; transition: stroke .5s; }
.wave.hot line { stroke: var(--accent); transition: none; }
.who { position: absolute; width: 220px; height: 220px; margin: -110px 0 0 -110px; z-index: 2; border-radius: 50%; background: var(--ink);
  display: flex; align-items: center; justify-content: center; }
.who svg { width: 128px; height: 128px; }

.bub { position: absolute; z-index: 2; padding: 18px 38px; font-weight: 700; line-height: 1.3; color: #fff; text-align: center;
  background: var(--other); border-radius: 48% 52% 46% 54% / 56% 46% 54% 44%; }
.bub.in { animation: rise .6s cubic-bezier(.2,1.3,.4,1); }
@keyframes rise { from { transform: scale(.35); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.dot { position: absolute; z-index: 2; border-radius: 50%; background: var(--other); }
.k-angry { background: var(--angry); }
.k-stuffy { background: var(--stuffy); }
.k-anxious { background: var(--anxious); }
.k-sad { background: var(--sad); }
.k-tired { background: var(--tired); }
.empty { position: absolute; z-index: 2; font-size: 28px; color: var(--soft); white-space: nowrap; transform: translateX(-50%); }
#stage.hide .bub { color: rgba(255,255,255,0); }
#stage.hide .bub::after { content: "?"; position: absolute; left: 0; right: 0; top: 50%; margin-top: -.65em; color: #fff; font-size: 1.1em; }

.foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 48px 32px; z-index: 3; pointer-events: none; }
.foot > * { pointer-events: auto; }
.ctl { display: flex; align-items: center; }
.count { font-size: 26px; font-weight: 700; margin-right: 24px; }
.count b { font-size: 48px; color: var(--accent); letter-spacing: -0.02em; }
button { font: inherit; font-size: 18px; font-weight: 700; border: 0; padding: 12px 18px; margin-right: 8px; cursor: pointer; background: var(--step); color: var(--ink); }
button:hover { background: #d2dae4; }
button:active { transform: translateY(1px); }
button:focus { outline: 3px solid var(--sad); outline-offset: 2px; }
.state { font-size: 16px; color: var(--soft); margin-left: 8px; }
.state.bad { color: var(--accent); font-weight: 700; }
.legend { display: flex; align-items: center; }
.legend span { display: flex; align-items: center; font-size: 20px; font-weight: 700; margin-left: 22px; }
.legend i { width: 18px; height: 18px; margin-right: 8px; }
.legend em { font-style: normal; color: var(--soft); margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { .bub.in { animation: none; } .wave line { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>

<header class="top">
  <h1 id="q"></h1>
  <div class="qr">
    <img src="qr.png" alt="휴대폰 답 화면 QR">
    <div>
      <div class="how">휴대폰으로 찍고<br>감정 보내기</div>
      <div class="url" id="url"></div>
    </div>
  </div>
</header>

<footer class="foot">
  <div class="ctl">
    <div class="count"><b id="n">0</b>개 도착</div>
    <button id="hideBtn" type="button">답 가리기</button>
    <button id="clearBtn" type="button">새 질문</button>
    <span class="state" id="state">연결하는 중…</span>
  </div>
  <div class="legend" id="legend"></div>
</footer>

<script src="config.js"></script>
<script>
var cfg = window.EMO;
var KEY = "emo-round-start";
var stage = document.getElementById("stage");
var KINDS = [
  { k: "angry",   name: "화남",      re: /화|분노|짜증|열받|어이|빡|격분|분통/ },
  { k: "stuffy",  name: "답답·억울", re: /답답|억울|황당|어처구니|기막|속\s*터/ },
  { k: "anxious", name: "불안·걱정", re: /불안|걱정|초조|당황|두려|무서|조급|급함|급해/ },
  { k: "sad",     name: "실망·서운", re: /실망|서운|속상|슬프|슬픔|허탈|섭섭|배신|무시/ },
  { k: "tired",   name: "지침",      re: /지침|지쳐|지친|피곤|귀찮|힘들|포기|체념/ }
];
var items = [], seen = {}, es = null, armed = false, hidden = false, font = 30;

document.getElementById("q").textContent = cfg.question;
document.getElementById("url").textContent = cfg.phoneUrl.replace("https://", "").replace(/\/$/, "");

function kindOf(text) {
  for (var i = 0; i < KINDS.length; i++) if (KINDS[i].re.test(text)) return KINDS[i].k;
  return "other";
}

function legend() {
  var html = "";
  KINDS.concat([{ k: "other", name: "그 밖" }]).forEach(function (d) {
    var n = items.filter(function (it) { return it.kind === d.k; }).length;
    html += '<span><i style="background:var(--' + d.k + ')"></i>' + d.name + "<em>" + n + "</em></span>";
  });
  document.getElementById("legend").innerHTML = html;
  document.getElementById("n").textContent = items.length;
}

// ---- 배치: 가운데 고객(+파형)을 피해 타원 나선으로 빈자리를 찾음. 자리가 없으면 글자를 줄여 다시 배치 ----
var G = {};
function geometry() {
  var W = stage.clientWidth, H = stage.clientHeight;
  G = { W: W, H: H, top: 200, bottom: H - 100, left: 40, right: W - 40 };
  G.cx = W / 2; G.cy = (G.top + G.bottom) / 2 + 6; G.r0 = 150;
}

function hits(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }

function place(w, h, idx, taken) {
  var sx = 1.75, start = idx * 2.39996; // 황금각으로 돌아가며 빈 방향부터
  for (var r = G.r0 + 40; r < 1400; r += 14) {
    var steps = Math.max(12, Math.round(r / 22));
    for (var s = 0; s < steps; s++) {
      var a = start + s * (Math.PI * 2 / steps);
      var x = G.cx + Math.cos(a) * r * sx - w / 2, y = G.cy + Math.sin(a) * r - h / 2;
      var box = { x: x - 10, y: y - 10, w: w + 20, h: h + 20 };
      if (x < G.left || x + w > G.right || y < G.top || y + h > G.bottom) continue;
      var nx = Math.max(x, Math.min(G.cx, x + w)), ny = Math.max(y, Math.min(G.cy, y + h));
      if (Math.pow(nx - G.cx, 2) + Math.pow(ny - G.cy, 2) < Math.pow(G.r0 + 44, 2)) continue;
      var ok = true;
      for (var i = 0; i < taken.length; i++) if (hits(box, taken[i])) { ok = false; break; }
      if (ok) return { x: x, y: y };
    }
  }
  return null;
}

function trail(el, kind) {
  var bx = el._x + el._w / 2, by = el._y + el._h / 2;
  var dx = G.cx - bx, dy = G.cy - by, d = Math.sqrt(dx * dx + dy * dy) || 1;
  dx /= d; dy /= d;
  var edge = 1 / Math.sqrt(Math.pow(dx / (el._w / 2), 2) + Math.pow(dy / (el._h / 2), 2));
  [[edge + 14, 11], [edge + 40, 7]].forEach(function (p) {
    if (p[0] > d - G.r0 - 20) return;
    var dot = document.createElement("div");
    dot.className = "dot k-" + kind;
    dot.style.width = dot.style.height = p[1] * 2 + "px";
    dot.style.left = bx + dx * p[0] - p[1] + "px";
    dot.style.top = by + dy * p[0] - p[1] + "px";
    stage.appendChild(dot);
  });
}

// 고객 둘레의 녹취 파형(막대 길이는 고정된 무늬)
function waveSvg() {
  var n = 84, rin = 124, size = 2 * (rin + 40), c = size / 2, lines = "";
  for (var i = 0; i < n; i++) {
    var a = i / n * Math.PI * 2;
    var len = 6 + 26 * Math.abs(Math.sin(i * 0.9) * Math.cos(i * 0.31) + 0.35 * Math.sin(i * 2.7));
    lines += '<line x1="' + (c + Math.cos(a) * rin).toFixed(1) + '" y1="' + (c + Math.sin(a) * rin).toFixed(1) +
      '" x2="' + (c + Math.cos(a) * (rin + len)).toFixed(1) + '" y2="' + (c + Math.sin(a) * (rin + len)).toFixed(1) + '"/>';
  }
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "wave"); svg.id = "wave";
  svg.setAttribute("width", size); svg.setAttribute("height", size);
  svg.style.left = G.cx - c + "px"; svg.style.top = G.cy - c + "px";
  svg.innerHTML = lines;
  return svg;
}

function drawBase() {
  stage.innerHTML = "";
  stage.appendChild(waveSvg());
  var who = document.createElement("div");
  who.className = "who";
  who.style.left = G.cx + "px"; who.style.top = G.cy + "px";
  // 고객: 사람 + 귀에 댄 수화기(통화 중)
  who.innerHTML = '<svg viewBox="0 0 48 48"><circle cx="21" cy="15" r="8" fill="#fff"/><path d="M5 43a16 13.1 0 0 1 32 0z" fill="#fff"/>' +
    '<path d="M33 7c3.2 0 5.5 2.7 5.5 6.4v3.4c0 3.7-2.3 6.4-5.5 6.4" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>' +
    '<rect x="30" y="5" width="5" height="5.5" rx="1.6" fill="#fff"/><rect x="30" y="20.2" width="5" height="5.5" rx="1.6" fill="#fff"/></svg>';
  stage.appendChild(who);
  if (!items.length) {
    var e = document.createElement("div");
    e.className = "empty"; e.textContent = "교육생이 보낸 감정이 고객 둘레에 떠오릅니다";
    e.style.left = G.cx + "px"; e.style.top = G.cy + 190 + "px";
    stage.appendChild(e);
  }
}

function makeBubble(it) {
  var el = document.createElement("div");
  el.className = "bub k-" + it.kind;
  el.style.fontSize = font + "px";
  el.style.maxWidth = Math.round(font * 12) + "px";
  el.textContent = it.text;
  el.style.left = "-9999px"; el.style.top = "0";
  stage.appendChild(el);
  el._w = el.offsetWidth; el._h = el.offsetHeight;
  return el;
}

// 처음부터 다시 배치(창 크기 변화·글자 줄임·비우기 때)
function layoutAll() {
  geometry(); drawBase();
  var taken = [];
  for (var i = 0; i < items.length; i++) {
    var el = makeBubble(items[i]);
    var p = place(el._w, el._h, i, taken);
    if (!p) { if (font > 16) { font -= 3; return layoutAll(); } p = { x: G.left, y: G.bottom - el._h }; }
    el._x = p.x; el._y = p.y; el.style.left = p.x + "px"; el.style.top = p.y + "px";
    taken.push({ x: p.x - 10, y: p.y - 10, w: el._w + 20, h: el._h + 20 });
    trail(el, items[i].kind);
  }
  stage._taken = taken;
}

function addOne(it) {
  items.push(it);
  var empty = stage.querySelector(".empty");
  if (empty) empty.parentNode.removeChild(empty);
  var el = makeBubble(it);
  var p = place(el._w, el._h, items.length - 1, stage._taken || []);
  if (!p) { stage.removeChild(el); font = Math.max(16, font - 3); layoutAll(); legend(); return; }
  el._x = p.x; el._y = p.y; el.style.left = p.x + "px"; el.style.top = p.y + "px";
  el.style.transformOrigin = (G.cx - p.x) + "px " + (G.cy - p.y) + "px";
  el.classList.add("in");
  (stage._taken = stage._taken || []).push({ x: p.x - 10, y: p.y - 10, w: el._w + 20, h: el._h + 20 });
  trail(el, it.kind);
  // 새 답이 오면 파형이 잠깐 빨갛게(녹취가 울리는 느낌)
  var wave = document.getElementById("wave");
  wave.setAttribute("class", "wave hot");
  setTimeout(function () { wave.setAttribute("class", "wave"); }, 120);
  legend();
}

// ---- 실시간 연결(ntfy.sh) ----
function now() { return Math.floor(Date.now() / 1000); }
function save(v) { try { localStorage.setItem(KEY, String(v)); } catch (e) {} }
function roundStart() {
  var v = 0;
  try { v = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
  if (!v || now() - v > 3 * 3600) { v = now(); save(v); }
  return v;
}
function state(text, bad) {
  var el = document.getElementById("state");
  el.textContent = text; el.className = "state" + (bad ? " bad" : "");
}
function connect() {
  if (es) es.close();
  es = new EventSource("https://ntfy.sh/" + cfg.topic + "/sse?since=" + roundStart());
  es.onopen = function () { state("실시간 연결됨"); };
  es.onerror = function () { state("연결 끊김, 다시 잇는 중… (회사망 차단일 수 있음)", true); };
  es.onmessage = function (ev) {
    var d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.event !== "message" || seen[d.id]) return;
    seen[d.id] = true;
    var text = String(d.message || "").slice(0, cfg.maxLen + 20);
    addOne({ text: text, kind: kindOf(text) });
  };
}

document.getElementById("hideBtn").addEventListener("click", function () {
  hidden = !hidden;
  stage.classList.toggle("hide", hidden);
  this.textContent = hidden ? "답 보이기" : "답 가리기";
});
document.getElementById("clearBtn").addEventListener("click", function () {
  if (!armed) { armed = true; this.textContent = "한 번 더 누르면 비워짐"; return; }
  armed = false; this.textContent = "새 질문";
  save(now()); seen = {}; items = []; font = 30;
  layoutAll(); legend(); connect();
});
var rt;
window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layoutAll, 200); });

layoutAll(); legend(); connect();
</script>
</body>
</html>
