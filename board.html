<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고객 감정 답 화면</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 빔프로젝터 FHD: 위 띠(질문 + QR), 아래 답 카드가 계속 쌓임. 회사 PC 크롬 84 기준(inset·aspect-ratio 안 씀) */
:root {
  --bg: #eef2f6; --ink: #17202b; --soft: #5d6876; --line: #cfd8e3;
  --red: #e0362c; --blue: #2f6fd6; --surface: #ffffff; --band: #17202b; --band-ink: #ffffff;
  --display: "Black Han Sans", "Malgun Gothic", sans-serif;
  --body: "Gothic A1", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); word-break: keep-all; }
.band { background: var(--band); color: var(--band-ink); }
.band .in { max-width: 1840px; margin: 0 auto; padding: 28px 40px; display: flex; gap: 40px; align-items: center; }
.ask { flex: 1; min-width: 0; }
.tag { font-size: 20px; font-weight: 800; color: #9cc0ff; }
h1 { font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1.2; margin: 6px 0 0; }
.qr { display: flex; gap: 18px; align-items: center; background: #fff; color: #17202b; border-radius: 18px; padding: 14px 20px 14px 14px; }
.qr img { width: 180px; height: 180px; display: block; }
.qr .how { font-size: 20px; font-weight: 800; line-height: 1.45; }
.qr .url { font-size: 15px; font-weight: 600; color: #5d6876; margin-top: 6px; }

.bar { max-width: 1840px; margin: 0 auto; padding: 18px 40px 0; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.count { font-size: 26px; font-weight: 800; margin-right: auto; }
.count b { color: var(--red); font-size: 40px; font-variant-numeric: tabular-nums; }
.state { font-size: 16px; font-weight: 600; color: var(--soft); }
.state.bad { color: var(--red); }
button { font: inherit; font-size: 18px; font-weight: 800; border-radius: 12px; padding: 10px 18px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
button.main { background: var(--blue); border-color: var(--blue); color: #fff; }
button.warn { border-color: var(--red); color: var(--red); }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.cards { max-width: 1840px; margin: 0 auto; padding: 22px 40px 48px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.card { background: var(--surface); border: 3px solid var(--line); border-radius: 16px; padding: 16px 22px;
  font-size: 32px; font-weight: 800; line-height: 1.35; max-width: 100%; animation: pop .5s ease-out; }
.card.new { border-color: var(--red); }
.empty { font-size: 28px; color: var(--soft); font-weight: 600; padding: 40px 0; }
.cards.hide .card { color: transparent; text-shadow: 0 0 18px rgba(23,32,43,.55); }
@keyframes pop { from { transform: translateY(10px); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
@media (max-width: 900px) {
  .band .in { flex-direction: column; align-items: flex-start; padding: 20px 16px; }
  h1 { font-size: 40px; }
  .bar, .cards { padding-left: 16px; padding-right: 16px; }
  .card { font-size: 24px; }
}
</style>
</head>
<body>
<header class="band">
  <div class="in">
    <div class="ask">
      <div class="tag">공감 교육 · 녹취 듣고 답하기</div>
      <h1 id="q"></h1>
    </div>
    <div class="qr">
      <img src="qr.png" alt="휴대폰 답 화면 QR">
      <div>
        <div class="how">휴대폰 카메라로<br>찍고 감정 보내기</div>
        <div class="url" id="url"></div>
      </div>
    </div>
  </div>
</header>
<div class="bar">
  <div class="count"><b id="n">0</b>개 도착</div>
  <span class="state" id="state">연결하는 중…</span>
  <button id="hideBtn" class="main" type="button">답 가리기</button>
  <button id="clearBtn" class="warn" type="button">새 질문(카드 비우기)</button>
</div>
<section class="cards" id="cards"><div class="empty" id="empty">교육생이 보낸 답이 여기에 바로 뜹니다</div></section>

<script src="config.js"></script>
<script>
var cfg = window.EMO;
var KEY = "emo-round-start";
var cards = document.getElementById("cards");
var seen = {}, total = 0, es = null, armed = false, hidden = false;

document.getElementById("q").textContent = cfg.question;
document.getElementById("url").textContent = cfg.phoneUrl.replace("https://", "");

function now() { return Math.floor(Date.now() / 1000); }

// 새로고침해도 이번 질문의 답은 다시 불러옴(3시간 지나면 새로 시작)
function roundStart() {
  var v = 0;
  try { v = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
  if (!v || now() - v > 3 * 3600) { v = now(); save(v); }
  return v;
}
function save(v) { try { localStorage.setItem(KEY, String(v)); } catch (e) {} }

function state(text, bad) {
  var el = document.getElementById("state");
  el.textContent = text; el.className = "state" + (bad ? " bad" : "");
}

function add(text) {
  var empty = document.getElementById("empty");
  if (empty) empty.remove();
  var old = cards.querySelectorAll(".card.new");
  for (var i = 0; i < old.length; i++) old[i].classList.remove("new");
  var c = document.createElement("div");
  c.className = "card new";
  c.textContent = text.slice(0, cfg.maxLen + 20);
  cards.appendChild(c);
  total++;
  document.getElementById("n").textContent = total;
}

function connect() {
  if (es) es.close();
  es = new EventSource("https://ntfy.sh/" + cfg.topic + "/sse?since=" + roundStart());
  es.onopen = function () { state("실시간 연결됨"); };
  es.onerror = function () { state("연결이 끊겨 다시 잇는 중… (회사망 차단일 수 있음)", true); };
  es.onmessage = function (ev) {
    var d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.event !== "message" || seen[d.id]) return;
    seen[d.id] = true;
    add(String(d.message || ""));
  };
}

document.getElementById("hideBtn").addEventListener("click", function () {
  hidden = !hidden;
  cards.classList.toggle("hide", hidden);
  this.textContent = hidden ? "답 보이기" : "답 가리기";
});

document.getElementById("clearBtn").addEventListener("click", function () {
  if (!armed) { armed = true; this.textContent = "한 번 더 누르면 비워짐"; return; }
  armed = false; this.textContent = "새 질문(카드 비우기)";
  save(now());
  seen = {}; total = 0;
  document.getElementById("n").textContent = "0";
  cards.innerHTML = '<div class="empty" id="empty">교육생이 보낸 답이 여기에 바로 뜹니다</div>';
  connect();
});

connect();
</script>
</body>
</html>
