<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고객 감정 맞히기</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 휴대폰 한 화면: 질문 → 입력칸 → 보내기 */
:root {
  --bg: #f4f6f9; --ink: #17202b; --soft: #5d6876; --line: #d9dee6;
  --red: #e0362c; --blue: #2f6fd6; --surface: #ffffff;
  --display: "Black Han Sans", "Malgun Gothic", sans-serif;
  --body: "Gothic A1", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161d; --ink: #eef1f5; --soft: #9aa5b3; --line: #2b3440;
  --red: #ff5a4e; --blue: #6a9bff; --surface: #1a212b; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.6; word-break: keep-all; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
  padding-top: max(28px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tag { font-size: 15px; font-weight: 800; color: var(--blue); }
h1 { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.3; margin: 0; }
textarea { width: 100%; min-height: 120px; resize: vertical; font: inherit; font-size: 20px; color: var(--ink);
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px; }
textarea:focus { outline: none; border-color: var(--blue); }
.meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--soft); }
button { font: inherit; font-size: 22px; font-weight: 800; color: #fff; background: var(--red); border: 0; border-radius: 14px; padding: 16px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.msg { min-height: 1.6em; font-weight: 600; }
.msg.ok { color: var(--blue); }
.msg.err { color: var(--red); }
</style>
</head>
<body>
<main class="wrap">
  <div class="tag">공감 교육 · 녹취 듣고 답하기</div>
  <h1 id="q"></h1>
  <label for="answer" class="meta"><span>한 단어도 좋고, 이유를 붙여도 좋아요</span><span id="len">0</span></label>
  <textarea id="answer" placeholder="예) 억울함, 같은 설명을 세 번이나 해서"></textarea>
  <button id="send" type="button">보내기</button>
  <div class="msg" id="msg" role="status"></div>
</main>
<script src="config.js"></script>
<script>
var cfg = window.EMO;
var box = document.getElementById("answer");
var btn = document.getElementById("send");
var msg = document.getElementById("msg");
document.getElementById("q").textContent = cfg.question;
box.maxLength = cfg.maxLen;

function count() { document.getElementById("len").textContent = box.value.length + " / " + cfg.maxLen; }
box.addEventListener("input", count); count();

function say(text, kind) { msg.textContent = text; msg.className = "msg " + (kind || ""); }

btn.addEventListener("click", function () {
  var text = box.value.replace(/\s+/g, " ").trim();
  if (!text) { say("먼저 감정을 적어 주세요.", "err"); box.focus(); return; }
  btn.disabled = true; say("보내는 중…");
  fetch("https://ntfy.sh/" + cfg.topic, { method: "POST", body: text })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      box.value = ""; count();
      say("보냈어요. 앞 화면을 보세요. 더 쓰려면 다시 적어 보내면 돼요.", "ok");
    })
    .catch(function () { say("보내지 못했어요. 잠시 뒤 다시 눌러 주세요.", "err"); })
    .then(function () { btn.disabled = false; });
});
</script>
</body>
</html>
