<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>고객 감정 맞히기</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&display=swap">
<style>
/* 교실 화면과 같은 레트로 창 한 장: 크림+청록 물결 바탕, 굵은 테두리 창 안에 질문 → 입력칸 → 보내기 */
:root {
  --cream: #f1eadb; --teal: #a9dadb; --paper: #fbf7ee; --ink: #1b1b1b; --soft: #5c5850; --red: #d23a2a; --ok: #2f7f86;
  --font: "LG스마트체", "Gothic A1", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--cream); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.5; word-break: keep-all; position: relative; overflow-x: hidden; }
#waves { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto;
  padding-top: max(28px, env(safe-area-inset-top, 0px)); padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.win { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 7px 7px 0 var(--ink); }
.tb { height: 44px; display: flex; align-items: center; padding: 0 14px; border-bottom: 3px solid var(--ink); font-size: 16px; font-weight: 700; }
.tb .o { width: 14px; height: 14px; border: 3px solid var(--ink); border-radius: 50%; margin-right: 5px; flex: none; }
.tb .t { flex: 1; text-align: center; margin-right: 38px; }
.body { padding: 22px 18px 20px; }
h1 { margin: 0 0 18px; font-size: 28px; font-weight: 800; line-height: 1.3; }
label { display: flex; justify-content: space-between; font-size: 15px; color: var(--soft); margin-bottom: 8px; }
textarea { width: 100%; min-height: 128px; resize: vertical; font: inherit; font-size: 21px; font-weight: 700; color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 14px; }
textarea::placeholder { color: #a39d90; font-weight: 400; }
textarea:focus { outline: none; background: #fffef8; box-shadow: 0 0 0 4px var(--teal); }
button { display: block; width: 100%; margin-top: 18px; font: inherit; font-size: 22px; font-weight: 800; color: var(--ink);
  background: var(--teal); border: 3px solid var(--ink); border-radius: 12px; padding: 15px; cursor: pointer; box-shadow: 5px 5px 0 var(--ink); }
button:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }
.msg { min-height: 1.5em; margin-top: 16px; font-weight: 700; }
.msg.ok { color: var(--ok); }
.msg.err { color: var(--red); }
</style>
</head>
<body>
<svg id="waves" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true">
  <path fill="#a9dadb" d="M0 120 C 120 60 220 200 400 130 L400 0 L0 0 Z"/>
  <path fill="#a9dadb" d="M0 560 C 140 470 230 650 400 590 L400 720 C 260 790 140 680 0 760 Z"/>
</svg>
<main class="wrap">
  <section class="win">
    <div class="tb"><span class="o"></span><span class="o"></span><span class="t">고객 마음 들여다보기</span></div>
    <div class="body">
      <h1 id="q"></h1>
      <label for="answer"><span>한 단어도 좋고, 이유를 붙여도 좋아요</span><span id="len">0</span></label>
      <textarea id="answer" placeholder="예) 억울함, 같은 설명을 세 번이나 해서"></textarea>
      <button id="send" type="button">보내기</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script>
var cfg = window.EMO;
var box = document.getElementById("answer");
var btn = document.getElementById("send");
var msg = document.getElementById("msg");
document.getElementById("q").textContent = cfg.question;
box.maxLength = cfg.maxLen;

function count() { document.getElementById("len").textContent = box.value.length + " / " + cfg.maxLen; }
box.addEventListener("input", count); count();

function say(text, kind) { msg.textContent = text; msg.className = "msg " + (kind || ""); }

btn.addEventListener("click", function () {
  var text = box.value.replace(/\s+/g, " ").trim();
  if (!text) { say("먼저 감정을 적어 주세요.", "err"); box.focus(); return; }
  btn.disabled = true; say("보내는 중…");
  fetch("https://ntfy.sh/" + cfg.topic, { method: "POST", body: text })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      box.value = ""; count();
      say("보냈어요. 앞 화면을 보세요. 더 쓰려면 다시 적어 보내면 돼요.", "ok");
    })
    .catch(function () { say("보내지 못했어요. 잠시 뒤 다시 눌러 주세요.", "err"); })
    .then(function () { btn.disabled = false; });
});
</script>
</body>
</html>
